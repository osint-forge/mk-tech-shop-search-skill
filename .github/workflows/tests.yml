name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19, which may not get builds of
    # Python 3.9, the oldest version the skill supports.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install client dependencies
        run: python -m pip install requests beautifulsoup4
      # The suites are offline; a dead proxy turns any accidental request to a shop into a failure.
      - name: Docs match the code
        env: {HTTP_PROXY: "http://127.0.0.1:9", HTTPS_PROXY: "http://127.0.0.1:9"}
        run: python -B tests/test_docs.py
      - name: mkshop.py and store clients
        env: {HTTP_PROXY: "http://127.0.0.1:9", HTTPS_PROXY: "http://127.0.0.1:9"}
        run: python -B tests/test_integ_fixes.py
      - name: mkshop.py against fake store clients
        env: {HTTP_PROXY: "http://127.0.0.1:9", HTTPS_PROXY: "http://127.0.0.1:9"}
        run: python -B tests/test_mkshop.py

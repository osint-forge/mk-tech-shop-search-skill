name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # The suites are offline; a dead proxy turns any accidental request to a shop into a failure.
      HTTP_PROXY: http://127.0.0.1:9
      HTTPS_PROXY: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install client dependencies
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
        run: python -m pip install requests beautifulsoup4
      - name: Docs match the code
        run: python -B tests/test_docs.py
      - name: mkshop.py and store clients
        run: python -B tests/test_integ_fixes.py
      - name: mkshop.py against fake store clients
        run: python -B tests/test_mkshop.py
